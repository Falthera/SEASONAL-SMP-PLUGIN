name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Determine next version
        id: version
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST=${LATEST#v}
          MAJOR=0
          MINOR=0
          PATCH=0
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: v$VERSION"

      - name: Update POM version
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
          mvn versions:commit

      - name: Build with Maven
        run: mvn clean package -DskipTests -Dcheckstyle.skip=true -B -V

      - name: Locate built artifact
        id: verify
        run: |
          JAR=$(find target -maxdepth 1 -type f \( -name "SeasonalSMP.jar" -o -name "SeasonalSMP-*.jar" \) ! -name "*sources*" ! -name "*javadoc*" | head -n 1)
          if [[ -z "$JAR" ]]; then
            echo "Built JAR not found in target/"
            ls -la target/ || true
            exit 1
          fi
          echo "jar-path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built artifact: $JAR"
          unzip -l "$JAR" | grep -q "plugin.yml" || { echo "plugin.yml missing from JAR"; exit 1; }

      - name: Generate SHA256 checksums
        run: |
          JAR="${{ steps.verify.outputs.jar-path }}"
          sha256sum "$JAR" > "${JAR}.sha256"

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ -f CHANGELOG.md ]]; then
            echo "content<<EOF" >> "$GITHUB_OUTPUT"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[?" ver { found=1 }
              found { print }
              /^## \\[?[0-9]/ && found { exit }
            ' CHANGELOG.md >> "$GITHUB_OUTPUT" || true
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "content=## SeasonalSMP v$VERSION\n\nBuilt on Paper 1.21.11.\n\n**Changes:**\n- See commit history and diff for details." >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        run: |
          git config user.name "Falthera"
          git config user.email "bot@example.com"
          git add pom.xml

          if git diff --cached --quiet; then
            echo "No version change to commit; skipping commit."
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          fi

          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists; skipping tag creation."
          else
            git tag "v${{ steps.version.outputs.version }}"
          fi

          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SeasonalSMP v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            ${{ steps.verify.outputs.jar-path }}
            ${{ steps.verify.outputs.jar-path }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
