name: Continuous Integration

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven



      - name: Build and run tests
        run: mvn clean verify -B -V

      - name: Verify JAR artifact
        run: |
          JAR=$(find target -maxdepth 1 -type f \( -name "SeasonalSMP.jar" -o -name "SeasonalSMP-*.jar" \) ! -name "*sources*" ! -name "*javadoc*" | head -n 1)

          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "No plugin JAR found in target/. Ensure Maven packaging produces SeasonalSMP*.jar."
            ls -la target || true
            exit 1
          fi

          unzip -l "$JAR" | grep -q "plugin.yml" || {
            echo "plugin.yml missing from JAR: $JAR"
            exit 1
          }

          echo "Build verified: $JAR"
